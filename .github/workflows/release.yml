name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# No job here pushes, so every checkout passes persist-credentials: false:
# the token would otherwise sit in .git/config for every later step and for
# the third-party release action, which uploads with the token it is handed.
jobs:
  # Derive the release's title and body from the pushed annotated tag's message
  # (subject line -> title, message body -> notes) so a release is fully written
  # the moment the tag lands. softprops/action-gh-release does not read the tag
  # itself, so we extract it once here and every release job below passes these
  # outputs as name/body — idempotent, since each job sets the same values.
  # Platform jobs upload into a draft. Only publish-release makes it public,
  # after signatures and the complete asset manifest have been verified.
  # Extraction goes through the GitHub API; see the step comment for why git
  # cannot be trusted for this.
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      title: ${{ steps.tag.outputs.title }}
      notes: ${{ steps.tag.outputs.notes }}
    steps:
      - id: tag
        name: Read title and notes from the annotated tag object
        # Read the annotation through the API rather than git: actions/checkout
        # materializes the pushed tag as a LIGHTWEIGHT ref, so `git for-each-ref
        # %(contents:*)` silently falls back to the tagged COMMIT's message —
        # which is how v1.5.0 shipped titled after its last commit. The API
        # always returns the real tag object, and needs no checkout at all.
        #
        # A lightweight tag has ref.object.type == "commit" and carries no
        # annotation. Fail closed: release notes are part of the release, not an
        # optional decoration that may silently disappear.
        #
        # IMPORTANT when tagging: `git tag -a --cleanup=verbatim -F notes`.
        # The default cleanup drops lines starting with '#', which would strip
        # the `## Section` headers before they ever reach the tag object
        # (see docs/RELEASE-CHECKLIST.md).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          obj_type="$(printf '%s' "$ref_json" | jq -r '.object.type')"
          obj_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha')"

          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$obj_type" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag. Releases require an annotated tag."
            exit 1
          fi
          message="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}" -q '.message')"

          # First line is the title; everything after the blank line is the body.
          title="$(printf '%s\n' "$message" | head -n 1)"
          notes="$(printf '%s\n' "$message" | tail -n +2 | sed '1{/^$/d;}')"
          if [ -z "$title" ] || [ -z "$notes" ]; then
            echo "::error::Annotated tag must contain a title, a blank line, and release notes."
            exit 1
          fi

          {
            printf 'title=%s\n' "$title"
            printf 'notes<<NOTES_EOF_28f1\n%s\nNOTES_EOF_28f1\n' "$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Require the tag to point at a green commit on main
        # The release jobs build with -DskipTests: they run the real-binary
        # smoke suite and nothing else, so nothing in this workflow would notice
        # a failing unit test, a SpotBugs finding or a coverage regression.
        # Re-running the full verify four times here would cost four platform
        # matrices per release for a result that already exists — the merge
        # commit on main was gated on exactly those checks. So verify the
        # provenance instead: the tag must be on main, and that commit's
        # required checks must have passed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" -q '.sha')"

          # compare/main...<sha> reports how <sha> relates to main. "identical"
          # is the tip; "behind" means it is an ancestor. "ahead" or "diverged"
          # means the tag was cut from something that never landed.
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" -q '.status')"
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::${GITHUB_REF_NAME} (${sha}) is not on main (compare says '${status}'). Release only from merged commits."
              exit 1
              ;;
          esac

          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100")"
          failed=0
          for check in test-macos test-linux test-linux-arm test-windows; do
            concl="$(printf '%s' "$runs" | jq -r --arg n "$check" \
              '[.check_runs[] | select(.name == $n)] | sort_by(.completed_at) | last | .conclusion // "missing"')"
            if [ "$concl" != "success" ]; then
              echo "::error::Required check '${check}' on ${sha} is '${concl}', not success."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Refusing to release. If the checks are simply too old to still exist, re-run them on ${sha} first."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is ${sha}, on main, with all four required checks green."

  release-macos:
    needs: prepare-release
    runs-on: macos-latest
    # notarytool --wait normally returns within minutes but Apple has taken half an hour.
    timeout-minutes: 45
    permissions:
      contents: write
    # The `secrets` context is not allowed in step `if:`, so the steps gate on
    # env — but only on these booleans. The secret values themselves stay out
    # of the job environment and are handed to the individual steps that use
    # them, so the third-party action at the end of this job never inherits a
    # signing key. Both are false until the secrets exist (docs/SIGNING.md),
    # so an unsigned release builds byte-for-byte as before.
    env:
      MACOS_SIGNING_CONFIGURED: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      MACOS_NOTARY_CONFIGURED: ${{ secrets.MACOS_NOTARY_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      # Shares the cache the Build workflow populates on merge to main, so a
      # tagged release does not re-download the sing-box tarballs. Keyed on
      # singbox.properties: a core bump misses and re-fetches, and
      # bundle-singbox.sh verifies the SHA-256 on cached bytes too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - name: Build fat JAR
        run: mvn clean package -DskipTests
      - name: Smoke-test the bundled sing-box
        # The DMG must never ship a core the generator can't drive: run the
        # real-binary smoke suite (version match, `sing-box check` on every
        # config shape, live run with clash_api + http-inbound probes).
        run: mvn test -Psmoke -Dtest=SingBoxRealBinarySmokeTest
      - name: Validate macOS signing configuration
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          vars=(
            MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY
            MACOS_NOTARY_KEY_BASE64 MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID
          )
          present=0
          for var in "${vars[@]}"; do
            [[ -n "${!var}" ]] && present=$((present + 1))
          done
          if (( present != 0 && present != ${#vars[@]} )); then
            echo "::error::macOS signing is partially configured. Set all six secrets or none."
            exit 1
          fi
      # --- Optional code signing (dormant until the secrets exist). ---
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_SIGNING_CONFIGURED == 'true' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -hex 20)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -F "$MACOS_SIGN_IDENTITY" >/dev/null
          # Add the signing keychain to the user search list (word-split of the
          # existing list is intentional).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Create DMG with jpackage
        # Staging + jpackage live in scripts/package-dmg.sh, shared with the
        # per-merge build in build.yml. sing-box is already baked into the
        # shaded JAR by scripts/bundle-singbox.sh during `mvn package`.
        # MACOS_SIGN_IDENTITY is empty without the secret → unsigned. The
        # keychain path comes from GITHUB_ENV, set by the import step above.
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: scripts/package-dmg.sh "${GITHUB_REF_NAME#v}"
      - name: Smoke-test the DMG payload
        # Before notarization, which takes minutes: mounts the DMG and checks
        # Tunl.app inside it (launcher, runtime, app.version, CFBundleVersion,
        # the darwin core in the jar) without launching it.
        run: scripts/macos-dmg-smoke.sh dist/*.dmg "${GITHUB_REF_NAME#v}"
      - name: Notarize and staple the DMG
        if: ${{ env.MACOS_NOTARY_CONFIGURED == 'true' }}
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit dist/*.dmg \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist/*.dmg
          xcrun stapler validate dist/*.dmg
          spctl -a -t open --context context:primary-signature dist/*.dmg
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ needs.prepare-release.outputs.title }}
          body: ${{ needs.prepare-release.outputs.notes }}
          draft: true
          files: dist/*.dmg

  # Windows twin of the job above: same gates (fat JAR, real-binary smoke),
  # same shared packaging script as the per-merge build, MSI instead of DMG.
  # Both jobs upload to the same tag's release; action-gh-release appends.
  release-windows:
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Only the gate lives in job env — the `secrets` context can't be used in
    # step `if:`. The certificate and its password go to the individual steps
    # that need them, so the third-party release action never inherits them.
    # False until the secret exists; the MSI is then unsigned as before.
    env:
      WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      # Shares the cache the Build workflow populates on merge to main, so a
      # tagged release does not re-download the sing-box tarballs. Keyed on
      # singbox.properties: a core bump misses and re-fetches, and
      # bundle-singbox.sh verifies the SHA-256 on cached bytes too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - name: Build fat JAR
        run: mvn -B clean package -DskipTests
      - name: Smoke-test the bundled sing-box
        # The MSI must never ship a core the generator can't drive: the same
        # real-binary smoke suite as macOS, running the bundled sing-box.exe.
        run: mvn -B test -Psmoke "-Dtest=SingBoxRealBinarySmokeTest"
      - name: Validate Windows signing configuration
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $configured = @(
            $env:WINDOWS_CERTIFICATE_PFX_BASE64,
            $env:WINDOWS_SIGN_PASSWORD
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($configured.Count -ne 0 -and $configured.Count -ne 2) {
            throw 'Windows signing is partially configured. Set both secrets or neither.'
          }
      # Optional: materialize the signing cert from a secret; package-windows.ps1
      # signs the MSI only when WINDOWS_SIGN_PFX is set. No-op otherwise.
      - name: Prepare code-signing certificate
        if: ${{ env.WINDOWS_SIGNING_CONFIGURED == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "WINDOWS_SIGN_PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Create MSI with jpackage
        # package-windows.ps1 signs only when WINDOWS_SIGN_PFX is set, which the
        # step above writes to GITHUB_ENV; the password comes straight from the
        # secret.
        env:
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -Version "$($env:GITHUB_REF_NAME -replace '^v', '')"
      - name: Verify Windows signature
        if: ${{ env.WINDOWS_SIGNING_CONFIGURED == 'true' }}
        shell: pwsh
        run: |
          & signtool verify /pa /v (Get-ChildItem dist -Filter '*.msi').FullName
          if ($LASTEXITCODE -ne 0) {
            throw "signtool verification failed with exit code $LASTEXITCODE"
          }
      - name: Smoke-test MSI install and uninstall
        shell: pwsh
        run: ./scripts/windows-msi-smoke.ps1 -MsiPath 'dist\*.msi' -ExpectedVersion ($env:GITHUB_REF_NAME -replace '^v', '')
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ needs.prepare-release.outputs.title }}
          body: ${{ needs.prepare-release.outputs.notes }}
          draft: true
          files: dist/*.msi

  # Linux twin: same gates (fat JAR, real-binary smoke), same shared
  # packaging script as the per-merge build, DEB instead of DMG/MSI.
  release-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      # Shares the cache the Build workflow populates on merge to main, so a
      # tagged release does not re-download the sing-box tarballs. Keyed on
      # singbox.properties: a core bump misses and re-fetches, and
      # bundle-singbox.sh verifies the SHA-256 on cached bytes too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - name: Build fat JAR
        run: mvn -B clean package -DskipTests
      - name: Smoke-test the bundled sing-box
        # The DEB must never ship a core the generator can't drive: the same
        # real-binary smoke suite as the other platforms.
        run: mvn -B test -Psmoke -Dtest=SingBoxRealBinarySmokeTest
      - name: Create DEB with jpackage
        run: scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - name: Smoke-test DEB install, launch and uninstall
        # The same check build.yml runs on every merge: install the .deb,
        # launch it under Xvfb until "Tunl started" is logged, uninstall.
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            xvfb xauth libgtk-3-0t64 libglib2.0-0t64 libxtst6 libxi6 libxrender1 libxrandr2 \
            libfreetype6 fontconfig libasound2t64 libgl1 libpango-1.0-0 libcairo2 fonts-dejavu-core
          scripts/linux-deb-smoke.sh dist/*.deb "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ needs.prepare-release.outputs.title }}
          body: ${{ needs.prepare-release.outputs.notes }}
          draft: true
          files: dist/*.deb

  # arm64 twin of release-linux on GitHub's free arm runners: same gates
  # (fat JAR, real-binary smoke on the linux-arm64 core), same script —
  # jpackage derives the deb architecture from the host.
  release-linux-arm64:
    needs: prepare-release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      # Shares the cache the Build workflow populates on merge to main, so a
      # tagged release does not re-download the sing-box tarballs. Keyed on
      # singbox.properties: a core bump misses and re-fetches, and
      # bundle-singbox.sh verifies the SHA-256 on cached bytes too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - name: Build fat JAR
        run: mvn -B clean package -DskipTests
      - name: Smoke-test the bundled sing-box
        run: mvn -B test -Psmoke -Dtest=SingBoxRealBinarySmokeTest
      - name: Create DEB with jpackage
        run: scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ needs.prepare-release.outputs.title }}
          body: ${{ needs.prepare-release.outputs.notes }}
          draft: true
          files: dist/*.deb

  # Sign every installer with the project release key, so the in-app updater
  # can tell a build we published from one that merely appeared on the release
  # page. What gets signed is the asset's "sha256:<hex>" digest string: Ed25519
  # cannot stream, and the updater already computes that digest while
  # downloading (see ReleaseSignature).
  #
  # Required, unlike the macOS and Windows certificates above, which only
  # affect how loudly the OS complains. The public half is compiled into the
  # app, so a release that reaches the page unsigned is one the in-app updater
  # will refuse for every user on a build that carries the key — a broken
  # release that would otherwise go out green. Missing secret, failed job.
  sign-release:
    needs: [prepare-release, release-macos, release-windows, release-linux, release-linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Sign installer assets
        # This job has exactly one step and no third-party action, but the key
        # still belongs to the step that uses it rather than the whole job.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set. The app verifies" \
              "release signatures against the key in ReleaseSignature.java," \
              "so an unsigned release cannot be installed by the updater." \
              "See docs/SIGNING.md."
            exit 1
          fi
          KEY="$RUNNER_TEMP/release.key"
          printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT

          V="${GITHUB_REF_NAME#v}"
          assets=(
            "tunl_${V}.dmg"
            "tunl_${V}.msi"
            "tunl_${V}_amd64.deb"
            "tunl_${V}_arm64.deb"
          )
          PUB="$RUNNER_TEMP/release.pub.pem"
          openssl pkey -in "$KEY" -pubout -out "$PUB"
          for asset in "${assets[@]}"; do
              gh release download "$GITHUB_REF_NAME" -p "$asset" \
                -O "$RUNNER_TEMP/$asset" --clobber
              hex=$(sha256sum "$RUNNER_TEMP/$asset" | awk '{print $1}')
              # No trailing newline: the updater signs and verifies exactly
              # the digest string it builds itself, with nothing around it.
              printf 'sha256:%s' "$hex" > "$RUNNER_TEMP/message"
              openssl pkeyutl -sign -rawin -inkey "$KEY" \
                -in "$RUNNER_TEMP/message" -out "$RUNNER_TEMP/signature"
              base64 -w0 "$RUNNER_TEMP/signature" > "$RUNNER_TEMP/$asset.sig"
              base64 -d "$RUNNER_TEMP/$asset.sig" > "$RUNNER_TEMP/signature.verify"
              openssl pkeyutl -verify -rawin -pubin -inkey "$PUB" \
                -in "$RUNNER_TEMP/message" -sigfile "$RUNNER_TEMP/signature.verify"
              gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset.sig" --clobber
              echo "signed $asset"
          done

  # Fill the Homebrew cask and AUR PKGBUILD templates with this release's
  # version and asset checksums, and attach the ready-to-use files to the
  # release. A tap/AUR maintainer copies them into their package repo (see
  # docs/DISTRIBUTION.md); the repo keeps the templates unfilled.
  update-packaging:
    needs: [prepare-release, release-macos, release-windows, release-linux, release-linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Regenerate cask + PKGBUILD with release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          sha_of() {
            gh release download "$GITHUB_REF_NAME" -p "$1" -O "$RUNNER_TEMP/$1" --clobber
            sha256sum "$RUNNER_TEMP/$1" | awk '{print $1}'
          }
          DMG=$(sha_of "tunl_${V}.dmg")
          DEB_AMD64=$(sha_of "tunl_${V}_amd64.deb")
          DEB_ARM64=$(sha_of "tunl_${V}_arm64.deb")
          scripts/update-packaging.sh "$V" "$DMG" "$DEB_AMD64" "$DEB_ARM64"
      # Re-assert name/body alongside the packaging uploads so this final call
      # can never blank the notes the platform jobs set.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ needs.prepare-release.outputs.title }}
          body: ${{ needs.prepare-release.outputs.notes }}
          draft: true
          files: |
            packaging/homebrew/tunl.rb
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO

  # A release is invisible to users until every installer, updater signature,
  # and package-manager file exists. This avoids a public partial release while
  # parallel upload/signing jobs are still running or after one has failed.
  publish-release:
    needs: [prepare-release, sign-release, update-packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify the asset manifest and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          expected=$(printf '%s\n' \
            "default.SRCINFO" \
            "PKGBUILD" \
            "tunl.rb" \
            "tunl_${V}.dmg" \
            "tunl_${V}.dmg.sig" \
            "tunl_${V}.msi" \
            "tunl_${V}.msi.sig" \
            "tunl_${V}_amd64.deb" \
            "tunl_${V}_amd64.deb.sig" \
            "tunl_${V}_arm64.deb" \
            "tunl_${V}_arm64.deb.sig" | sort)
          actual=$(gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' | sort)
          if ! diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"); then
            echo "::error::Release asset manifest is incomplete or contains unexpected files."
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "Published verified release $GITHUB_REF_NAME"

  # Keep the Releases page tidy: once all four installers are attached, delete
  # every real release older than the 5 newest. The rolling dev-latest
  # prerelease and any draft are never counted or touched. Git tags are kept
  # (no --cleanup-tag), so version history stays intact and any pruned build
  # can be rebuilt from its tag — only the Releases-page entry and its uploaded
  # installers go. Runs only after the verified draft is made public.
  prune-old-releases:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete real releases older than the newest 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          stale=$(gh release list --json tagName,isPrerelease,isDraft,createdAt \
            --jq 'map(select((.isPrerelease or .isDraft) | not))
                  | sort_by(.createdAt) | reverse | .[5:][].tagName')
          if [ -z "$stale" ]; then
            echo "5 or fewer real releases — nothing to prune."
            exit 0
          fi
          echo "Pruning releases older than the newest 5 (tags kept):"
          echo "$stale"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --yes && echo "deleted release $tag" \
              || echo "::warning::could not delete release $tag (will retry next release)"
          done <<< "$stale"
