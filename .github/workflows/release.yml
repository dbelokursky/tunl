name: Release
on:
  push:
    tags: ['v*']
# Runs for one tag queue rather than overlap (a tag deleted and pushed again
# while its first run is still going). Two overlapping runs would share the
# tag's draft, overwrite each other's installers with --clobber, and could
# publish installers that do not match their signatures and checksums. A
# running release is never cancelled, but its publish-release refuses a tag
# that no longer names the tag object and commit the run started from, so the
# earlier run ends without publishing, and the later run, starting then,
# adopts its draft, rebuilds and publishes it. Only a push that lands after the
# release went public stops at "already released". A run still waiting in the
# queue gives way to a newer push of the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  # The JDK jpackage bakes into every installer of a release: one pin for
  # the whole workflow, the same one build.yml tests on.
  JAVA_VERSION: '25'
# No job here pushes, so every checkout passes persist-credentials: false:
# the token would otherwise sit in .git/config for every later step of the job.
jobs:
  # prepare-release derives the release's title and body from the pushed
  # annotated tag's message (subject line -> title, message body -> notes) so a
  # release is fully written the moment the tag lands, and refuses a tag whose
  # commit is not green on main. Extraction goes through the GitHub API; see
  # the step comment for why git cannot be trusted for this.
  #
  # create-draft then makes the tag's one draft release (or adopts it on a
  # re-run, writing the tag's title and notes onto it) and hands its id on.
  # The platform jobs, sign-release and update-packaging only upload into that
  # draft with gh; only publish-release makes it public, by id, after checking
  # the draft is the only release object on the tag and holds exactly the
  # expected assets, and that the tag still names the tag object and commit
  # this run started from. One job creates because in v1.19.0 two jobs ran a
  # check-then-create release action at the same moment: both found no
  # release, both created one, and a second, empty draft was left on the tag.
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      title: ${{ steps.tag.outputs.title }}
      notes: ${{ steps.tag.outputs.notes }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
    steps:
      - id: tag
        name: Read title and notes from the annotated tag object
        # Read the annotation through the API rather than git: actions/checkout
        # materializes the pushed tag as a LIGHTWEIGHT ref, so `git for-each-ref
        # %(contents:*)` silently falls back to the tagged COMMIT's message —
        # which is how v1.5.0 shipped titled after its last commit. The API
        # always returns the real tag object, and needs no checkout at all.
        #
        # A lightweight tag has ref.object.type == "commit" and carries no
        # annotation. Fail closed: release notes are part of the release, not an
        # optional decoration that may silently disappear.
        #
        # IMPORTANT when tagging: `git tag -a --cleanup=verbatim -F notes`.
        # The default cleanup drops lines starting with '#', which would strip
        # the `## Section` headers before they ever reach the tag object
        # (see docs/RELEASE-CHECKLIST.md).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          obj_type="$(printf '%s' "$ref_json" | jq -r '.object.type')"
          obj_sha="$(printf '%s' "$ref_json" | jq -r '.object.sha')"

          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$obj_type" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag. Releases require an annotated tag."
            exit 1
          fi
          message="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}" -q '.message')"

          # First line is the title; everything after the blank line is the body.
          title="$(printf '%s\n' "$message" | head -n 1)"
          notes="$(printf '%s\n' "$message" | tail -n +2 | sed '1{/^$/d;}')"
          if [ -z "$title" ] || [ -z "$notes" ]; then
            echo "::error::Annotated tag must contain a title, a blank line, and release notes."
            exit 1
          fi

          # The title and notes belong to this tag object alone: publish-release
          # compares it with the tag again, so a tag pushed again while this run
          # was going does not go out with this run's notes.
          {
            printf 'title=%s\n' "$title"
            printf 'tag_object=%s\n' "$obj_sha"
            printf 'notes<<NOTES_EOF_28f1\n%s\nNOTES_EOF_28f1\n' "$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Require the tag to point at a green commit on main
        # The release jobs build with -DskipTests: they run the real-binary
        # smoke suite and nothing else, so nothing in this workflow would notice
        # a failing unit test, a SpotBugs finding or a coverage regression.
        # Re-running the full verify four times here would cost four platform
        # matrices per release for a result that already exists — the merge
        # commit on main was gated on exactly those checks. So verify the
        # provenance instead: the tag must be on main, and that commit's
        # required checks must have passed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" -q '.sha')"

          # compare/main...<sha> reports how <sha> relates to main. "identical"
          # is the tip; "behind" means it is an ancestor. "ahead" or "diverged"
          # means the tag was cut from something that never landed.
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" -q '.status')"
          case "$status" in
            identical|behind) ;;
            *)
              echo "::error::${GITHUB_REF_NAME} (${sha}) is not on main (compare says '${status}'). Release only from merged commits."
              exit 1
              ;;
          esac

          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100")"
          failed=0
          for check in test-macos test-linux test-linux-arm test-windows; do
            concl="$(printf '%s' "$runs" | jq -r --arg n "$check" \
              '[.check_runs[] | select(.name == $n)] | sort_by(.completed_at) | last | .conclusion // "missing"')"
            if [ "$concl" != "success" ]; then
              echo "::error::Required check '${check}' on ${sha} is '${concl}', not success."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Refusing to release. If the checks are simply too old to still exist, re-run them on ${sha} first."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is ${sha}, on main, with all four required checks green."

  # The only job that creates a release. Everything after it uploads into the
  # draft whose id it outputs, so no two jobs can race to create one.
  create-draft:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - id: draft
        name: Create or adopt the tag's draft release
        # A re-run of this run, or an earlier failed run for the same tag, has
        # already made the draft: adopt it rather than add a second one. The
        # release list (paginated; a contents: write token sees drafts) is the
        # only view that shows every release object on the tag, but it lags a
        # few seconds behind writes, so an empty list is double-checked with
        # gh release view, which also finds drafts, before anything is created.
        # gh also says "release not found" when its draft lookup failed rather
        # than came back empty, so a draft made seconds earlier can still be
        # missed; no other run for this tag can be making one (see concurrency
        # above), and publish-release refuses a tag with two release objects.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ needs.prepare-release.outputs.title }}
          NOTES: ${{ needs.prepare-release.outputs.notes }}
        run: |
          set -euo pipefail
          # One "id<TAB>draft<TAB>asset count" line per release object on the tag.
          # $ENV is jq's, not the shell's (gh's --jq takes no --arg).
          # shellcheck disable=SC2016
          if ! rows="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == $ENV.GITHUB_REF_NAME)
                    | [.id, .draft, (.assets | length)] | @tsv')"; then
            echo "::error::Could not list the releases of ${GH_REPO}."
            exit 1
          fi
          count=0
          if [ -n "$rows" ]; then
            count="$(printf '%s\n' "$rows" | wc -l | tr -d ' ')"
          fi

          id=""
          if [ "$count" -ge 2 ]; then
            echo "::error::${GITHUB_REF_NAME} has ${count} release objects; it must have at most one. Delete the extras by id, never with gh release delete <tag>, which picks one of them for you:"
            while IFS=$'\t' read -r rid rdraft rassets; do
              echo "  release ${rid}: draft=${rdraft}, ${rassets} assets -> gh api -X DELETE repos/${GH_REPO}/releases/${rid}"
            done <<< "$rows"
            exit 1
          elif [ "$count" -eq 1 ]; then
            IFS=$'\t' read -r id draft _ <<< "$rows"
            found_by="the release list"
          else
            err="$RUNNER_TEMP/release-view.err"
            if view="$(gh release view "$GITHUB_REF_NAME" --json databaseId,isDraft \
                --jq '[.databaseId, .isDraft] | @tsv' 2> "$err")"; then
              IFS=$'\t' read -r id draft <<< "$view"
              found_by="gh release view"
            elif ! grep -qxF 'release not found' "$err"; then
              cat "$err" >&2
              echo "::error::gh release view ${GITHUB_REF_NAME} failed for a reason other than a missing release."
              exit 1
            fi
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s' "$NOTES" > "$notes_file"
          if [ -n "$id" ]; then
            if [ "$draft" != "true" ]; then
              echo "::error::${GITHUB_REF_NAME} is already released (release ${id}, found by ${found_by}). Refusing to touch a published release."
              exit 1
            fi
            # Write this tag's title and notes onto the adopted draft: no later
            # job sets them, and a new run for the same tag means the tag was
            # pushed again, often with corrected notes. tag_name goes along
            # because gh release edit always sends it, as a PATCH without one
            # can take the tag off the release.
            if ! patched="$(gh api --method PATCH "repos/${GH_REPO}/releases/${id}" \
                -f tag_name="$GITHUB_REF_NAME" -f name="$TITLE" \
                -F body=@"$notes_file" --jq '"\(.id) \(.draft)"')"; then
              echo "::error::Writing the title and notes of ${GITHUB_REF_NAME} onto draft ${id} failed."
              exit 1
            fi
            if [ "$patched" != "${id} true" ]; then
              echo "::error::GitHub answered the update of draft ${id} with '${patched}', not '${id} true'."
              exit 1
            fi
            how="Adopted the existing draft"
          else
            # One POST, never retried: a POST whose response was lost may still
            # have created the release, and a retry would add the duplicate
            # this job exists to prevent. A failed run is re-run instead, and
            # the re-run adopts whatever this attempt left.
            if ! id="$(gh api --method POST "repos/${GH_REPO}/releases" \
                -f tag_name="$GITHUB_REF_NAME" -f name="$TITLE" \
                -F body=@"$notes_file" -F draft=true --jq .id)"; then
              echo "::error::Creating the draft release for ${GITHUB_REF_NAME} failed. Check gh release list for a release the request may still have made, then re-run."
              exit 1
            fi
            how="Created the draft"
          fi

          if ! [[ "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected a numeric release id for ${GITHUB_REF_NAME}, got '${id}'."
            exit 1
          fi
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"
          echo "${how} release ${id} for ${GITHUB_REF_NAME}."

  release-macos:
    needs: create-draft
    runs-on: macos-latest
    # notarytool --wait normally returns within minutes but Apple has taken half an hour.
    timeout-minutes: 45
    # The digest of the DMG this job uploaded; sign-release and
    # update-packaging refuse an asset on the draft that does not match it.
    outputs:
      dmg_sha256: ${{ steps.checksum.outputs.sha256 }}
    permissions:
      contents: write
    # The `secrets` context is not allowed in step `if:`, so the steps gate on
    # env — but only on these booleans. The secret values themselves stay out
    # of the job environment and are handed to the individual steps that use
    # them, so no other step, the upload at the end of this job included, ever
    # inherits a signing key. Both are false until the secrets exist
    # (docs/SIGNING.md), so an unsigned release builds byte-for-byte as before.
    env:
      MACOS_SIGNING_CONFIGURED: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      MACOS_NOTARY_CONFIGURED: ${{ secrets.MACOS_NOTARY_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      # Shares the cache the Build workflow populates on merge to main, so a
      # tagged release does not re-download the sing-box tarballs. Keyed on
      # singbox.properties: a core bump misses and re-fetches, and
      # bundle-singbox.sh verifies the SHA-256 on cached bytes too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - name: Build fat JAR
        run: mvn clean package -DskipTests
      - name: Smoke-test the bundled sing-box
        # The DMG must never ship a core the generator can't drive: run the
        # real-binary smoke suite (version match, `sing-box check` on every
        # config shape, live run with clash_api + http-inbound probes).
        run: mvn test -Psmoke -Dtest=SingBoxRealBinarySmokeTest
      - name: Validate macOS signing configuration
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          vars=(
            MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGN_IDENTITY
            MACOS_NOTARY_KEY_BASE64 MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID
          )
          present=0
          for var in "${vars[@]}"; do
            [[ -n "${!var}" ]] && present=$((present + 1))
          done
          if (( present != 0 && present != ${#vars[@]} )); then
            echo "::error::macOS signing is partially configured. Set all six secrets or none."
            exit 1
          fi
      # --- Optional code signing (dormant until the secrets exist). ---
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_SIGNING_CONFIGURED == 'true' }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -hex 20)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -F "$MACOS_SIGN_IDENTITY" >/dev/null
          # Add the signing keychain to the user search list (word-split of the
          # existing list is intentional).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Create DMG with jpackage
        # Staging + jpackage live in scripts/package-dmg.sh, shared with the
        # per-merge build in build.yml. sing-box is already baked into the
        # shaded JAR by scripts/bundle-singbox.sh during `mvn package`.
        # MACOS_SIGN_IDENTITY is empty without the secret → unsigned. The
        # keychain path comes from GITHUB_ENV, set by the import step above.
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: scripts/package-dmg.sh "${GITHUB_REF_NAME#v}"
      - name: Smoke-test the DMG payload
        # Before notarization, which takes minutes: mounts the DMG and checks
        # Tunl.app inside it (launcher, runtime, app.version, CFBundleVersion,
        # the darwin core in the jar) without launching it.
        run: scripts/macos-dmg-smoke.sh dist/*.dmg "${GITHUB_REF_NAME#v}"
      - name: Notarize and staple the DMG
        if: ${{ env.MACOS_NOTARY_CONFIGURED == 'true' }}
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit dist/*.dmg \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple dist/*.dmg
          xcrun stapler validate dist/*.dmg
          spctl -a -t open --context context:primary-signature dist/*.dmg
      - name: Record the DMG checksum
        id: checksum
        # After stapling, which rewrites the DMG: the digest must describe
        # the file the next step uploads, byte for byte.
        run: |
          set -euo pipefail
          files=(dist/*.dmg)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "::error::expected exactly one DMG in dist/"
            exit 1
          fi
          echo "sha256=$(shasum -a 256 "${files[0]}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload the DMG into the draft release
        # The step above guarantees exactly one DMG. --clobber lets a re-run
        # replace the asset an earlier attempt left on the draft.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber

  # Windows twin of the job above: same gates (fat JAR, real-binary smoke),
  # same shared packaging script as the per-merge build, MSI instead of DMG.
  # Every platform job uploads into the draft create-draft made.
  release-windows:
    needs: create-draft
    runs-on: windows-latest
    timeout-minutes: 30
    # The digest of the MSI this job uploaded; sign-release refuses an asset
    # on the draft that does not match it.
    outputs:
      msi_sha256: ${{ steps.checksum.outputs.sha256 }}
    permissions:
      contents: write
    # Only the gate lives in job env — the `secrets` context can't be used in
    # step `if:`. The certificate and its password go to the individual steps
    # that need them, so no other step, the upload included, inherits them.
    # False until the secret exists; the MSI is then unsigned as before.
    env:
      WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      # Shares the cache the Build workflow populates on merge to main, so a
      # tagged release does not re-download the sing-box tarballs. Keyed on
      # singbox.properties: a core bump misses and re-fetches, and
      # bundle-singbox.sh verifies the SHA-256 on cached bytes too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - name: Build fat JAR
        run: mvn -B clean package -DskipTests
      - name: Smoke-test the bundled sing-box
        # The MSI must never ship a core the generator can't drive: the same
        # real-binary smoke suite as macOS, running the bundled sing-box.exe.
        run: mvn -B test -Psmoke "-Dtest=SingBoxRealBinarySmokeTest"
      - name: Validate Windows signing configuration
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $configured = @(
            $env:WINDOWS_CERTIFICATE_PFX_BASE64,
            $env:WINDOWS_SIGN_PASSWORD
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($configured.Count -ne 0 -and $configured.Count -ne 2) {
            throw 'Windows signing is partially configured. Set both secrets or neither.'
          }
      # Optional: materialize the signing cert from a secret; package-windows.ps1
      # signs the MSI only when WINDOWS_SIGN_PFX is set. No-op otherwise.
      - name: Prepare code-signing certificate
        if: ${{ env.WINDOWS_SIGNING_CONFIGURED == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "WINDOWS_SIGN_PFX=$pfx" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Create MSI with jpackage
        # package-windows.ps1 signs only when WINDOWS_SIGN_PFX is set, which the
        # step above writes to GITHUB_ENV; the password comes straight from the
        # secret.
        env:
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -Version "$($env:GITHUB_REF_NAME -replace '^v', '')"
      - name: Verify Windows signature
        if: ${{ env.WINDOWS_SIGNING_CONFIGURED == 'true' }}
        shell: pwsh
        run: |
          & signtool verify /pa /v (Get-ChildItem dist -Filter '*.msi').FullName
          if ($LASTEXITCODE -ne 0) {
            throw "signtool verification failed with exit code $LASTEXITCODE"
          }
      - name: Smoke-test MSI install and uninstall
        shell: pwsh
        run: ./scripts/windows-msi-smoke.ps1 -MsiPath 'dist\*.msi' -ExpectedVersion ($env:GITHUB_REF_NAME -replace '^v', '')
      - name: Record the MSI checksum
        id: checksum
        # After signing, which rewrites the MSI (the install smoke only reads
        # it): the digest must describe the file the next step uploads.
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem dist -Filter '*.msi' -File)
          if ($msis.Count -ne 1) {
            throw "expected exactly one MSI in dist/, found $($msis.Count)"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $msis[0].FullName).Hash.ToLowerInvariant()
          "sha256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
      - name: Upload the MSI into the draft release
        # pwsh does not expand dist/*.msi for a native command, so resolve the
        # one file first. --clobber lets a re-run replace the asset an earlier
        # attempt left on the draft.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $msis = @(Get-ChildItem dist -Filter '*.msi' -File)
          if ($msis.Count -ne 1) {
            throw "expected exactly one MSI in dist/, found $($msis.Count)"
          }
          $msi = $msis[0].FullName
          gh release upload $env:GITHUB_REF_NAME $msi --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "gh release upload failed with exit code $LASTEXITCODE"
          }

  # Linux twin: same gates (fat JAR, real-binary smoke), same shared
  # packaging script as the per-merge build, DEB instead of DMG/MSI.
  release-linux:
    needs: create-draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The digest of the DEB this job uploaded; sign-release and
    # update-packaging refuse an asset on the draft that does not match it.
    outputs:
      deb_sha256: ${{ steps.checksum.outputs.sha256 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      # Shares the cache the Build workflow populates on merge to main, so a
      # tagged release does not re-download the sing-box tarballs. Keyed on
      # singbox.properties: a core bump misses and re-fetches, and
      # bundle-singbox.sh verifies the SHA-256 on cached bytes too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - name: Build fat JAR
        run: mvn -B clean package -DskipTests
      - name: Smoke-test the bundled sing-box
        # The DEB must never ship a core the generator can't drive: the same
        # real-binary smoke suite as the other platforms.
        run: mvn -B test -Psmoke -Dtest=SingBoxRealBinarySmokeTest
      - name: Create DEB with jpackage
        run: scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - name: Smoke-test DEB install, launch and uninstall
        # The same check build.yml runs on every merge: install the .deb,
        # launch it under Xvfb until "Tunl started" is logged, uninstall.
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            xvfb xauth libgtk-3-0t64 libglib2.0-0t64 libxtst6 libxi6 libxrender1 libxrandr2 \
            libfreetype6 fontconfig libasound2t64 libgl1 libpango-1.0-0 libcairo2 fonts-dejavu-core
          scripts/linux-deb-smoke.sh dist/*.deb "${GITHUB_REF_NAME#v}"
      - name: Record the DEB checksum
        id: checksum
        run: |
          set -euo pipefail
          files=(dist/*.deb)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "::error::expected exactly one DEB in dist/"
            exit 1
          fi
          echo "sha256=$(sha256sum "${files[0]}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload the DEB into the draft release
        # The step above guarantees exactly one DEB. --clobber lets a re-run
        # replace the asset an earlier attempt left on the draft.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

  # arm64 twin of release-linux on GitHub's free arm runners: same gates
  # (fat JAR, real-binary smoke on the linux-arm64 core), same script —
  # jpackage derives the deb architecture from the host.
  release-linux-arm64:
    needs: create-draft
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # The digest of the DEB this job uploaded; sign-release and
    # update-packaging refuse an asset on the draft that does not match it.
    outputs:
      deb_sha256: ${{ steps.checksum.outputs.sha256 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      # Shares the cache the Build workflow populates on merge to main, so a
      # tagged release does not re-download the sing-box tarballs. Keyed on
      # singbox.properties: a core bump misses and re-fetches, and
      # bundle-singbox.sh verifies the SHA-256 on cached bytes too.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - name: Build fat JAR
        run: mvn -B clean package -DskipTests
      - name: Smoke-test the bundled sing-box
        run: mvn -B test -Psmoke -Dtest=SingBoxRealBinarySmokeTest
      - name: Create DEB with jpackage
        run: scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - name: Record the DEB checksum
        id: checksum
        run: |
          set -euo pipefail
          files=(dist/*.deb)
          if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
            echo "::error::expected exactly one DEB in dist/"
            exit 1
          fi
          echo "sha256=$(sha256sum "${files[0]}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload the DEB into the draft release
        # The step above guarantees exactly one DEB. --clobber lets a re-run
        # replace the asset an earlier attempt left on the draft.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

  # Sign every installer with the project release key, so the in-app updater
  # can tell a build we published from one that merely appeared on the release
  # page. What gets signed is the asset's "sha256:<hex>" digest string: Ed25519
  # cannot stream, and the updater already computes that digest while
  # downloading (see ReleaseSignature).
  #
  # Required, unlike the macOS and Windows certificates above, which only
  # affect how loudly the OS complains. The public half is compiled into the
  # app, so a release that reaches the page unsigned is one the in-app updater
  # will refuse for every user on a build that carries the key — a broken
  # release that would otherwise go out green. Missing secret, failed job.
  #
  # Signs only what the builder jobs produced: every asset is downloaded
  # from the draft and checked against the SHA-256 its builder recorded (the
  # jobs' outputs above) before a single signature is made, so a file
  # swapped on the draft between upload and signing gets no signature.
  sign-release:
    needs: [prepare-release, release-macos, release-windows, release-linux, release-linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Sign installer assets
        # This job has exactly one step and no third-party action, but the key
        # still belongs to the step that uses it rather than the whole job.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT_DMG_SHA256: ${{ needs.release-macos.outputs.dmg_sha256 }}
          BUILT_MSI_SHA256: ${{ needs.release-windows.outputs.msi_sha256 }}
          BUILT_DEB_AMD64_SHA256: ${{ needs.release-linux.outputs.deb_sha256 }}
          BUILT_DEB_ARM64_SHA256: ${{ needs.release-linux-arm64.outputs.deb_sha256 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set. The app verifies" \
              "release signatures against the key in ReleaseSignature.java," \
              "so an unsigned release cannot be installed by the updater." \
              "See docs/SIGNING.md."
            exit 1
          fi
          KEY="$RUNNER_TEMP/release.key"
          printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$KEY"
          chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT

          V="${GITHUB_REF_NAME#v}"
          assets=(
            "tunl_${V}.dmg"
            "tunl_${V}.msi"
            "tunl_${V}_amd64.deb"
            "tunl_${V}_arm64.deb"
          )
          # Asset name -> the SHA-256 its builder job recorded for the file it
          # uploaded. A digest that is missing or malformed fails the release
          # too: a job whose output went missing must not pass as "nothing to
          # compare".
          declare -A built=(
            ["tunl_${V}.dmg"]="$BUILT_DMG_SHA256"
            ["tunl_${V}.msi"]="$BUILT_MSI_SHA256"
            ["tunl_${V}_amd64.deb"]="$BUILT_DEB_AMD64_SHA256"
            ["tunl_${V}_arm64.deb"]="$BUILT_DEB_ARM64_SHA256"
          )
          # Download and verify every asset before signing any: a file that
          # changed on the draft between its upload and this download gets no
          # signature, and a bad draft never ends up half-signed.
          for asset in "${assets[@]}"; do
              expected="${built[$asset]}"
              if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::No builder digest for ${asset} (got '${expected}'). Refusing to sign an asset this run cannot vouch for."
                exit 1
              fi
              gh release download "$GITHUB_REF_NAME" -p "$asset" \
                -O "$RUNNER_TEMP/$asset" --clobber
              actual=$(sha256sum "$RUNNER_TEMP/$asset" | awk '{print $1}')
              if [ "$actual" != "$expected" ]; then
                echo "::error::${asset} on the draft release is not the file its builder job uploaded (built ${expected}, downloaded ${actual}). Not signing."
                exit 1
              fi
              echo "verified $asset ($actual)"
          done
          PUB="$RUNNER_TEMP/release.pub.pem"
          openssl pkey -in "$KEY" -pubout -out "$PUB"
          for asset in "${assets[@]}"; do
              hex=$(sha256sum "$RUNNER_TEMP/$asset" | awk '{print $1}')
              # No trailing newline: the updater signs and verifies exactly
              # the digest string it builds itself, with nothing around it.
              printf 'sha256:%s' "$hex" > "$RUNNER_TEMP/message"
              openssl pkeyutl -sign -rawin -inkey "$KEY" \
                -in "$RUNNER_TEMP/message" -out "$RUNNER_TEMP/signature"
              base64 -w0 "$RUNNER_TEMP/signature" > "$RUNNER_TEMP/$asset.sig"
              base64 -d "$RUNNER_TEMP/$asset.sig" > "$RUNNER_TEMP/signature.verify"
              openssl pkeyutl -verify -rawin -pubin -inkey "$PUB" \
                -in "$RUNNER_TEMP/message" -sigfile "$RUNNER_TEMP/signature.verify"
              gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset.sig" --clobber
              echo "signed $asset"
          done

  # Fill the Homebrew cask and AUR PKGBUILD templates with this release's
  # version and asset checksums, and attach the ready-to-use files to the
  # release. A tap/AUR maintainer copies them into their package repo (see
  # docs/DISTRIBUTION.md); the repo keeps the templates unfilled.
  update-packaging:
    needs: [prepare-release, release-macos, release-windows, release-linux, release-linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Regenerate cask + PKGBUILD with release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT_DMG_SHA256: ${{ needs.release-macos.outputs.dmg_sha256 }}
          BUILT_DEB_AMD64_SHA256: ${{ needs.release-linux.outputs.deb_sha256 }}
          BUILT_DEB_ARM64_SHA256: ${{ needs.release-linux-arm64.outputs.deb_sha256 }}
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          # The digest stamped into the cask and the PKGBUILD is the one the
          # asset's builder job recorded; the download only confirms the
          # draft still holds that exact file (the check sign-release makes).
          sha_of() { # $1 asset name, $2 the builder's digest
            if ! [[ "$2" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::No builder digest for $1 (got '$2')." >&2
              return 1
            fi
            gh release download "$GITHUB_REF_NAME" -p "$1" -O "$RUNNER_TEMP/$1" --clobber
            local actual
            actual=$(sha256sum "$RUNNER_TEMP/$1" | awk '{print $1}')
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 on the draft release is not the file its builder job uploaded (built $2, downloaded $actual)." >&2
              return 1
            fi
            printf '%s\n' "$actual"
          }
          DMG=$(sha_of "tunl_${V}.dmg" "$BUILT_DMG_SHA256")
          DEB_AMD64=$(sha_of "tunl_${V}_amd64.deb" "$BUILT_DEB_AMD64_SHA256")
          DEB_ARM64=$(sha_of "tunl_${V}_arm64.deb" "$BUILT_DEB_ARM64_SHA256")
          scripts/update-packaging.sh "$V" "$DMG" "$DEB_AMD64" "$DEB_ARM64"
      - name: Upload cask, PKGBUILD and .SRCINFO into the draft release
        # GitHub stores an asset uploaded as .SRCINFO under the name
        # default.SRCINFO. Upload it under that name, so the name --clobber
        # replaces on a re-run and the name publish-release's manifest expects
        # are the file's own name rather than a server-side rename.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp packaging/aur/.SRCINFO "$RUNNER_TEMP/default.SRCINFO"
          gh release upload "$GITHUB_REF_NAME" packaging/homebrew/tunl.rb \
            packaging/aur/PKGBUILD "$RUNNER_TEMP/default.SRCINFO" --clobber

  # A release is invisible to users until every installer, updater signature,
  # and package-manager file exists. This avoids a public partial release while
  # parallel upload/signing jobs are still running or after one has failed.
  # The jobs before this one reach the draft by tag, and gh resolves a tag
  # that carries two release objects to whichever GitHub picks, so the draft
  # is published by the id create-draft handed on, and only once it is the
  # tag's one release object and the one the tag resolves to.
  publish-release:
    needs: [prepare-release, create-draft, sign-release, update-packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify the draft and its asset manifest, then publish it by id
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
          TAG_OBJECT: ${{ needs.prepare-release.outputs.tag_object }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::create-draft handed on no usable release id (got '${RELEASE_ID}')."
            exit 1
          fi
          if ! [[ "$TAG_OBJECT" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "::error::prepare-release handed on no usable tag object (got '${TAG_OBJECT}')."
            exit 1
          fi

          # $ENV is jq's, not the shell's (gh's --jq takes no --arg).
          # shellcheck disable=SC2016
          if ! ids="$(gh api --paginate "repos/${GH_REPO}/releases?per_page=100" \
              --jq '.[] | select(.tag_name == $ENV.GITHUB_REF_NAME) | .id')"; then
            echo "::error::Could not list the releases of ${GH_REPO}."
            exit 1
          fi
          if [ "$ids" != "$RELEASE_ID" ]; then
            echo "::error::${GITHUB_REF_NAME} must have exactly one release object, the draft ${RELEASE_ID} create-draft made. The release list shows: ${ids//$'\n'/ }"
            while IFS= read -r rid; do
              if [ -n "$rid" ] && [ "$rid" != "$RELEASE_ID" ]; then
                echo "  extra release ${rid} -> gh api -X DELETE repos/${GH_REPO}/releases/${rid}"
              fi
            done <<< "$ids"
            exit 1
          fi

          if ! viewed="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)"; then
            echo "::error::gh release view ${GITHUB_REF_NAME} failed."
            exit 1
          fi
          if [ "$viewed" != "$RELEASE_ID" ]; then
            echo "::error::gh release view ${GITHUB_REF_NAME} resolves to release ${viewed}, not the draft ${RELEASE_ID}: the uploads, signatures and packaging files may have gone to another release."
            exit 1
          fi

          if ! draft="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq .draft)"; then
            echo "::error::Could not read release ${RELEASE_ID}."
            exit 1
          fi
          if [ "$draft" != "true" ]; then
            echo "::error::Release ${RELEASE_ID} is no longer a draft (draft=${draft}). Not publishing it again."
            exit 1
          fi

          V="${GITHUB_REF_NAME#v}"
          expected=$(printf '%s\n' \
            "default.SRCINFO" \
            "PKGBUILD" \
            "tunl.rb" \
            "tunl_${V}.dmg" \
            "tunl_${V}.dmg.sig" \
            "tunl_${V}.msi" \
            "tunl_${V}.msi.sig" \
            "tunl_${V}_amd64.deb" \
            "tunl_${V}_amd64.deb.sig" \
            "tunl_${V}_arm64.deb" \
            "tunl_${V}_arm64.deb.sig" | sort)
          # One "name<TAB>state" line per asset of this draft, from one listing.
          if ! assets="$(gh api --paginate "repos/${GH_REPO}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq '.[] | [.name, .state] | @tsv')"; then
            echo "::error::Could not list the assets of release ${RELEASE_ID}."
            exit 1
          fi
          actual=$(printf '%s\n' "$assets" | cut -f1 | sort)
          if ! diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"); then
            echo "::error::Release asset manifest is incomplete or contains unexpected files."
            exit 1
          fi
          pending=$(printf '%s\n' "$assets" | awk -F'\t' 'NF && $2 != "uploaded" { print $1 " (" $2 ")" }')
          if [ -n "$pending" ]; then
            echo "::error::Release ${RELEASE_ID} has assets that did not finish uploading: ${pending//$'\n'/, }"
            exit 1
          fi

          # Last before the PATCH, leaving the tag the least time to move. The
          # title and notes came from TAG_OBJECT and the installers from
          # GITHUB_SHA; actions/checkout fails a job whose tag names another
          # commit, but not a tag pushed again on the same commit with new
          # notes (as v1.9.0 was). A push during this run queues the run for it
          # behind this one: publishing here would put this run's notes or
          # build under that tag and stop the queued run at "already released",
          # so the draft is left for that run to adopt instead.
          if ! tag_now="$(gh api "repos/${GH_REPO}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.sha)"; then
            echo "::error::Could not read the tag ${GITHUB_REF_NAME}; it may have been deleted since this run started. Not publishing draft ${RELEASE_ID}; if the tag is pushed again, the run for that push adopts it."
            exit 1
          fi
          if ! commit_now="$(gh api "repos/${GH_REPO}/commits/${GITHUB_REF_NAME}" --jq .sha)"; then
            echo "::error::Could not resolve ${GITHUB_REF_NAME} to a commit. Not publishing draft ${RELEASE_ID}."
            exit 1
          fi
          if [ "$tag_now" != "$TAG_OBJECT" ] || [ "$commit_now" != "$GITHUB_SHA" ]; then
            echo "::error::${GITHUB_REF_NAME} was pushed again: it is now tag object ${tag_now} on ${commit_now}, but this run has the notes of ${TAG_OBJECT} and installers built from ${GITHUB_SHA}. Not publishing: the run for that push adopts draft ${RELEASE_ID}, rebuilds and publishes it."
            exit 1
          fi

          if ! published="$(gh api --method PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
              -F draft=false --jq .draft)"; then
            echo "::error::Publishing release ${RELEASE_ID} failed."
            exit 1
          fi
          if [ "$published" != "false" ]; then
            echo "::error::GitHub answered the publish of release ${RELEASE_ID} with draft=${published}."
            exit 1
          fi
          echo "Published verified release $GITHUB_REF_NAME"

  # Keep the Releases page tidy: once all four installers are attached, delete
  # every real release older than the 5 newest. The rolling dev-latest
  # prerelease and any draft are never counted or touched. Git tags are kept
  # (no --cleanup-tag), so version history stays intact and any pruned build
  # can be rebuilt from its tag — only the Releases-page entry and its uploaded
  # installers go. Runs only after the verified draft is made public.
  prune-old-releases:
    needs: publish-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete real releases older than the newest 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          stale=$(gh release list --json tagName,isPrerelease,isDraft,createdAt \
            --jq 'map(select((.isPrerelease or .isDraft) | not))
                  | sort_by(.createdAt) | reverse | .[5:][].tagName')
          if [ -z "$stale" ]; then
            echo "5 or fewer real releases — nothing to prune."
            exit 0
          fi
          echo "Pruning releases older than the newest 5 (tags kept):"
          echo "$stale"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --yes && echo "deleted release $tag" \
              || echo "::warning::could not delete release $tag (will retry next release)"
          done <<< "$stale"
