name: Core
# Builds the sing-box core Tunl bundles: upstream's source at a version
# (the one singbox.properties pins unless a run names another), with
# packaging/sing-box/reality-xray.patch applied, against the uTLS it requires
# with packaging/sing-box/utls-presets.patch applied
# (packaging/sing-box/README.md says why). Every target is built and the
# REALITY hello checked on each pull request that touches the core. A run by
# hand, or one bump-singbox.yml starts, also publishes the build as the
# pre-release core-v<version>-tunl<N>, which singbox.properties then pins by
# digest.
on:
  pull_request:
    paths:
      - 'packaging/sing-box/**'
      - '.github/workflows/core.yml'
      - 'src/main/resources/singbox.properties'
  # By hand from any branch, so that a patch rebased onto a new version can be
  # built, published and pinned in the same pull request.
  workflow_dispatch:
    inputs:
      version:
        description: 'sing-box version to build (x.y.z); the pinned one when empty'
        required: false
        type: string
      revision:
        description: 'The N in core-v<version>-tunlN: 1 for a new version, one more for a rebuild'
        required: true
        default: '1'
        type: string
  # From bump-singbox.yml, when upstream has a version no core-v…-tunl release
  # has been built from yet.
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        required: true
        type: string

# Each job asks for what it needs; nothing is granted by default.
permissions:
  contents: read

# A newer push supersedes a pull request's run; a run that publishes is never
# cut off halfway, it waits.
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What Tunl's configurations use, and nothing it does not: on macOS the
  # core runs as administrator, so tailscale, acme, cloudflared, openvpn and
  # the like are left out, and so is with_dhcp: no configuration Tunl writes
  # has a DHCP DNS server, and DnsAddress refuses dhcp:// in Settings and MCP.
  # badlinkname and tfogo_checklinkname0 are upstream's, for Go's linkname
  # checks. tunl marks the build in `sing-box version`.
  TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0,tunl

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - {target: darwin-arm64, goos: darwin, goarch: arm64}
          - {target: darwin-amd64, goos: darwin, goarch: amd64}
          - {target: windows-amd64, goos: windows, goarch: amd64}
          - {target: linux-amd64, goos: linux, goarch: amd64}
          - {target: linux-arm64, goos: linux, goarch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Choose the version
        id: pin
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(sed -n 's/^singbox\.version=//p' src/main/resources/singbox.properties)}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a plain x.y.z version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SagerNet/sing-box
          ref: v${{ steps.pin.outputs.version }}
          path: sing-box
          persist-credentials: false

      # The Go upstream's own release workflow builds this tag with. go.mod
      # names only the oldest Go the module accepts (1.25.5 for 1.14.x, with
      # no toolchain line), and installing from it linked every
      # core-v…-tunlN with that release, without the crypto/tls, x509 and
      # net/url fixes upstream's build of the same tag (1.26.8) carries.
      # go-version.sh fails the run when the version cannot be read. Its
      # output is assigned before it is written: inside echo's arguments the
      # substitution's exit status was lost (errexit does not see it), so a
      # failure wrote an empty version, setup-go fell back to go.mod's Go, and
      # the run failed only after all five builds, at the go-version check.
      - name: Choose the Go toolchain
        id: go
        run: |
          version=$(packaging/sing-box/go-version.sh sing-box)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No cache saved from a pull request: it is visible to that pull
      # request alone, and such copies filled the 10 GB quota and pushed
      # main's caches out (build.yml says more).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: ${{ github.event_name != 'pull_request' }}
          cache-dependency-path: sing-box/go.sum

      - name: Apply the patch
        working-directory: sing-box
        run: git apply --verbose ../packaging/sing-box/reality-xray.patch

      # sing-box builds with metacubex/utls, whose Firefox and Safari hellos
      # (Firefox 120, Safari 16.0) carry no X25519MLKEM768 key share, which
      # REALITY on Xray 26.9.8 requires. utls-presets.patch adds Firefox 148
      # and Safari 26.3 from refraction-networking/utls to the version sing-box
      # requires; go mod download fetches that version and checks it against
      # sing-box's go.sum, and the build takes the patched copy in its place.
      # The patch is applied from the top of this checkout, as git apply skips
      # every file of a patch run from a subdirectory of a repository, and
      # still succeeds.
      - name: Patch uTLS
        env:
          MODULE: github.com/metacubex/utls
        run: |
          version=$(cd sing-box && go list -m -f '{{.Version}}' "$MODULE")
          info=$(cd sing-box && go mod download -json "$MODULE@$version")
          source=$(jq -r .Dir <<<"$info")
          echo "$MODULE $version $(jq -r .Sum <<<"$info")"
          cp -R "$source" utls
          chmod -R u+w utls
          git apply --verbose --directory=utls packaging/sing-box/utls-presets.patch
          (cd sing-box && go mod edit -replace "$MODULE=../utls")

      # uTLS's own tests on the patched copy, the two the Firefox commit
      # brought among them. Seconds, and the same on every target.
      - name: Test the patched uTLS
        if: matrix.target == 'linux-amd64'
        working-directory: utls
        run: go test .

      - name: Build
        working-directory: sing-box
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.pin.outputs.version }}
          GO_VERSION: ${{ steps.go.outputs.version }}
        run: |
          ext=""
          if [ "$GOOS" = windows ]; then ext=.exe; fi
          out="sing-box-${VERSION}-${TARGET}"
          mkdir -p "../dist/$out"
          go build -v -trimpath -o "../dist/$out/sing-box$ext" -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' $(cat release/LDFLAGS) -s -w -buildid=" \
            ./cmd/sing-box
          # The binary records the Go it was linked with; it must be the one
          # chosen above, not one a go.mod toolchain line switched to.
          built=$(go version "../dist/$out/sing-box$ext" | awk '{print $2}')
          if [ "$built" != "go${GO_VERSION}" ]; then
            echo "::error::sing-box$ext was built with $built, not go${GO_VERSION}"
            exit 1
          fi
          cp LICENSE "../dist/$out/"
          cd ../dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$out.zip" "$out"
          else
            tar -czf "$out.tar.gz" "$out"
          fi
          rm -rf "$out"

      - name: Check the REALITY hello
        if: matrix.target == 'linux-amd64'
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: packaging/sing-box/verify.sh "dist/sing-box-${VERSION}-linux-amd64.tar.gz"

      # The same check on upstream's own build of this version has to fail,
      # or it proves nothing: a check the unpatched core passes would pass
      # patches that did nothing too. The token fetches the archive and is
      # gone before the archive's binary runs.
      - name: Fetch upstream's build
        if: matrix.target == 'linux-amd64'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          asset="sing-box-${VERSION}-linux-amd64.tar.gz"
          gh release download "v${VERSION}" --repo SagerNet/sing-box --pattern "$asset" --dir upstream
          expected=$(gh release view "v${VERSION}" --repo SagerNet/sing-box --json assets \
            --jq ".assets[] | select(.name == \"$asset\") | .digest")
          actual="sha256:$(sha256sum "upstream/$asset" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "upstream's $asset is $actual, the release says $expected" >&2
            exit 1
          fi

      # It has to fail on the hellos themselves (1), not because the core sent
      # none (2): a check that never saw a hello fails any build. And each
      # hello has to fail for want of the X25519MLKEM768 share, which upstream
      # cuts out of every REALITY hello: its client version (1.8.1) alone
      # fails them all, and would hide a check that no longer sees the share.
      - name: Check that upstream's build fails it
        if: matrix.target == 'linux-amd64'
        env:
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -o pipefail
          status=0
          packaging/sing-box/verify.sh "upstream/sing-box-${VERSION}-linux-amd64.tar.gz" 2>&1 \
            | tee upstream.log || status=$?
          if [ "$status" -eq 0 ]; then
            echo "upstream's build passes the check, so the check cannot tell the patches apart" >&2
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "the check judged no hello of upstream's build (exit $status), so it proves nothing" >&2
            exit 1
          fi
          checked=$(grep -c '^== ' upstream.log)
          shareless=$(grep -c '^FAIL: no X25519MLKEM768 key share ahead of X25519' upstream.log || true)
          if [ "$shareless" -ne "$checked" ]; then
            echo "only $shareless of upstream's $checked hellos failed for want of the X25519MLKEM768" \
              "share, so the check cannot be shown to see it" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The only job with write access, and it runs no build: it takes the
  # archives the build jobs made, adds the digests and the corresponding
  # source (upstream's at the tag, plus the two patches; sing-box is
  # GPL-3.0), and publishes them as a pre-release that never becomes
  # "latest", which the app's updater reads. Never for a pull request.
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Choose the version
        id: pin
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(sed -n 's/^singbox\.version=//p' src/main/resources/singbox.properties)}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a plain x.y.z version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: SagerNet/sing-box
          ref: v${{ steps.pin.outputs.version }}
          path: sing-box
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: core-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          case "$REVISION" in ''|*[!0-9]*) echo "revision must be a number" >&2; exit 1 ;; esac
          tag="core-v${VERSION}-tunl${REVISION}"
          git -C sing-box archive --format=tar.gz --prefix="sing-box-${VERSION}/" \
            -o "../dist/sing-box-${VERSION}-source.tar.gz" HEAD
          cp packaging/sing-box/reality-xray.patch packaging/sing-box/utls-presets.patch dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          blob="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/packaging/sing-box"
          cat > notes.md <<EOF
          sing-box ${VERSION}, built from upstream's source at v${VERSION} with
          [reality-xray.patch](${blob}/reality-xray.patch) applied, and with
          [utls-presets.patch](${blob}/utls-presets.patch) applied to the uTLS it
          requires, for Tunl to bundle. The patches let REALITY connect to Xray 26.7
          and later: browser hellos with their X25519MLKEM768 key share (Chrome 133,
          Firefox 148, Safari 26.3, and every randomized one), and client version
          26.3.27. See packaging/sing-box/README.md.

          Built by run ${GITHUB_RUN_ID} of ${GITHUB_SHA}. sing-box is GPL-3.0: the
          corresponding source is sing-box-${VERSION}-source.tar.gz with
          reality-xray.patch, and the github.com/metacubex/utls version its go.mod
          requires, from the Go module proxy, with utls-presets.patch.
          EOF
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Core ${VERSION} (tunl${REVISION})" --notes-file notes.md \
            --prerelease --latest=false
