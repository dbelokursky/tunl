name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Superseded PR pushes cancel their older runs. Every push to main gets a
# group of its own, so every merge is built: in one shared group GitHub keeps
# a single pending run and cancels the one before it, and a merge that landed
# while another was building went unbuilt (#318's 1ec98cf, cancelled before
# any job started). dev-release below takes the uploads one at a time.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # The JDK every job tests on and jpackage bakes into every installer: one
  # pin for the whole workflow. There is no early-access canary beside it at
  # the moment: the newest 28 build Adoptium publishes does not match the
  # sha256 they advertise for it, so setup-java refuses it and the job could
  # only be red. Bring it back -- one release ahead, its own pin, never near
  # a packaging job -- once those builds verify again.
  JAVA_VERSION: '27'
# Every checkout passes persist-credentials: false except dev-release's, the
# one job that pushes (git tag -f and a force push of dev-latest). Nothing
# else needs the token in .git/config, where every later step could read it.
jobs:
  # ============ Tests: run on every PR and push, one job per OS ============
  # -Psmoke additionally runs the real-binary smoke suites against the
  # bundled sing-box of that OS: version match, `sing-box check` over every
  # generated config shape, live runs (clash_api/http inbound; TUN probes
  # where the runner allows). Catches generator/core schema drift per OS.

  test:
    name: test-${{ matrix.name }}
    strategy:
      # Every leg reports on its own: a Windows-only failure must not cancel
      # the macOS run that would tell whether the change is cross-platform.
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
          - { name: linux, os: ubuntu-latest }
          # arm64 twin: GitHub's free arm runners for public repos. Exercises
          # the arch-aware bundling (linux-arm64 sing-box) with the same gates.
          - { name: linux-arm, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    # A leg takes 4 to 11 minutes, macOS the longest; the Windows and Linux
    # legs add about two to package and smoke-test their installer. The smoke
    # suite runs the real core, including TUN probes where the runner allows;
    # a hang there would otherwise sit on the 6-hour default, on every leg,
    # until someone noticed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'zulu'
      # Caches are restored here and saved from main only, below. A cache
      # saved from a pull request is visible to that pull request alone, so
      # those copies filled the 10 GB quota and pushed main's out; and with
      # no restore-keys, a pom change started from an empty repository, which
      # once failed main on a download from Central. restore-keys take the
      # newest repository of the same OS and arch instead.
      - id: maven-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-${{ runner.arch }}-
      # The sing-box tarballs are fetched at generate-resources on every build
      # (bundle-core-* profiles), so cache them per OS/arch. singbox.properties
      # pins both the version and the SHA-256s, so a bump misses the cache and
      # re-downloads; bundle-singbox.sh verifies the checksum either way.
      - id: core-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      # ./mvnw, so every runner builds with the Maven this repository pins:
      # the arm64 image carries 3.9.12 and the others 3.9.16, and a plugin
      # version can come from the Maven rather than from the POM. bash also on
      # Windows, where the default shell is PowerShell and mvnw is a script.
      - name: Timer probe (experiment)
        if: matrix.name == 'macos' || matrix.name == 'linux'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/TimerProbe.java" <<'JAVA'
          import java.util.concurrent.locks.LockSupport;
          public class TimerProbe {
              public static void main(String[] a) throws Exception {
                  for (long want : new long[] {1, 10, 16}) {
                      long total = 0, worst = 0;
                      for (int i = 0; i < 100; i++) {
                          long t = System.nanoTime();
                          Thread.sleep(want);
                          long took = System.nanoTime() - t;
                          total += took; worst = Math.max(worst, took);
                      }
                      System.out.printf("sleep(%d ms): mean %.2f ms, worst %.2f ms%n",
                              want, total / 100 / 1e6, worst / 1e6);
                  }
                  long total = 0;
                  for (int i = 0; i < 100; i++) {
                      long t = System.nanoTime();
                      LockSupport.parkNanos(1_000_000);
                      total += System.nanoTime() - t;
                  }
                  System.out.printf("parkNanos(1 ms): mean %.2f ms%n", total / 100 / 1e6);
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/jfr"
          { java "$RUNNER_TEMP/TimerProbe.java"; nproc 2>/dev/null || sysctl -n hw.ncpu; } \
            | tee "$RUNNER_TEMP/jfr/timer-probe.txt"
      - name: Profile the slowest UI tests (experiment)
        if: matrix.name == 'macos' || matrix.name == 'linux'
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -XX:StartFlightRecording=filename=${{ runner.temp }}/jfr/%p.jfr,settings=profile
        run: |
          start=$(date +%s)
          ./mvnw -B -q test -Djacoco.skip=true -Dcheckstyle.skip -Dspotbugs.skip=true \
            -Dtest='ViewDialogThemeTest,LogsViewTest,DialogStageThemeTest,ControlSizingTest' \
            || true
          echo "ui subset took $(( $(date +%s) - start )) s" | tee -a "$RUNNER_TEMP/jfr/timer-probe.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && (matrix.name == 'macos' || matrix.name == 'linux')
        with:
          name: probe-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/jfr/
          retention-days: 3
      - name: Stop here (experiment)
        if: matrix.name == 'macos' || matrix.name == 'linux'
        run: exit 1
      - run: ./mvnw -B clean verify -Psmoke
        shell: bash
      - name: Lint the shell scripts
        # What the build, the packaging and the app's own launchers run in a
        # shell, some of it as root on a user's machine: a quoting slip fails
        # here rather than there. shellcheck ships with the ubuntu image.
        if: matrix.name == 'linux'
        shell: bash
        run: |
          shopt -s nullglob
          shellcheck scripts/*.sh src/main/resources/scripts/*.sh

      - name: Name the failed tests
        # The job log is readable only signed in, or as a download from blob
        # storage that some networks cannot reach; an annotation comes from
        # the checks API. One per failing test class, with the head of its
        # surefire report: long enough to carry the thread summary a timed-out
        # wait appends (testing/ThreadDump.forBackgroundWork), under the 64 KB
        # an annotation holds.
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for report in target/surefire-reports/*.txt; do
            if grep -q -E '<<< (FAILURE|ERROR)!' "$report"; then
              body=$(grep -E -A180 '<<< (FAILURE|ERROR)!' "$report" | head -360 | cut -c1-160 \
                | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
              echo "::error title=$(basename "$report" .txt)::${body}"
            fi
          done
      - name: Save the Maven repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}
      - name: Save the core download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - name: Probe a runtime linked from scripts/runtime-modules.txt
        # The suite runs on the full JDK, so a module missing from the
        # packaged runtime is invisible to it: this links exactly the listed
        # modules and probes what no test exercises. Linux only — the list is
        # the same on every OS, and one leg is enough to notice a gap.
        if: matrix.name == 'linux'
        run: scripts/verify-runtime-modules.sh
      # The installer of each leg that can build one on a PR, checked on the
      # runner that built it and inside the required check. A package job of
      # its own ran after the tests without being required, and PRs merged
      # minutes before it finished, so a broken MSI install or DEB launch
      # merged green. The suite above already built the JAR these package.
      - name: Package MSI
        if: matrix.name == 'windows'
        # pwsh is the Windows default; naming it tells actionlint the step is
        # not a bash script, which runs-on from the matrix does not.
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -Version "1.0.0-dev-$($env:GITHUB_SHA.Substring(0,7))" -MsiVersion "1.0.${{ github.run_number }}"
      - name: Smoke-test MSI install and uninstall
        if: matrix.name == 'windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-msi-smoke.ps1 -MsiPath "dist\*.msi" -ExpectedVersion "1.0.0-dev-$($env:GITHUB_SHA.Substring(0,7))"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.name == 'windows'
        with:
          name: vless-client-windows-${{ github.sha }}
          path: dist/*.msi
          retention-days: 14
          if-no-files-found: error
      - name: Package DEB
        if: matrix.name == 'linux'
        run: scripts/package-linux.sh "1.0.0-dev-${GITHUB_SHA:0:7}" "1.0.0+dev${{ github.run_number }}"
      - name: Smoke-test DEB install, launch and uninstall
        if: matrix.name == 'linux'
        # Installs the .deb on the runner, runs /opt/tunl/bin/tunl under Xvfb
        # until the app writes "Tunl started" to its own log, then removes
        # the package. The libraries are the set scripts/linux-qa.sh needs to
        # render JavaFX without a GPU.
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            xvfb xauth libgtk-3-0t64 libglib2.0-0t64 libxtst6 libxi6 libxrender1 libxrandr2 \
            libfreetype6 fontconfig libasound2t64 libgl1 libpango-1.0-0 libcairo2 fonts-dejavu-core
          scripts/linux-deb-smoke.sh dist/*.deb "1.0.0-dev-${GITHUB_SHA:0:7}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.name == 'linux'
        with:
          name: vless-client-linux-${{ github.sha }}
          path: dist/*.deb
          retention-days: 14
          if-no-files-found: error
      # The DMG and the arm64 DEB, built and checked here like the MSI and
      # the amd64 DEB above. Jobs of their own built them on main only, after
      # the merge, so a broken one merged green.
      - name: Package DMG
        if: matrix.name == 'macos'
        run: scripts/package-dmg.sh "1.0.0-dev-${GITHUB_SHA:0:7}" "1.0.${{ github.run_number }}"
      - name: Smoke-test the DMG payload
        if: matrix.name == 'macos'
        # Mounts the DMG and checks Tunl.app inside it: launcher, runtime,
        # app.version, CFBundleVersion, the darwin core in the jar. Not
        # launched — the script says why a CI Mac is the wrong place for it.
        run: scripts/macos-dmg-smoke.sh dist/*.dmg "1.0.0-dev-${GITHUB_SHA:0:7}" "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.name == 'macos'
        with:
          name: vless-client-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 14
          if-no-files-found: error
      - name: Package DEB (arm64)
        if: matrix.name == 'linux-arm'
        run: scripts/package-linux.sh "1.0.0-dev-${GITHUB_SHA:0:7}" "1.0.0+dev${{ github.run_number }}"
      - name: Smoke-test DEB install, launch and uninstall (arm64)
        if: matrix.name == 'linux-arm'
        # The check test-linux runs on the amd64 package: install the .deb,
        # launch it under Xvfb until "Tunl started" is logged, uninstall.
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            xvfb xauth libgtk-3-0t64 libglib2.0-0t64 libxtst6 libxi6 libxrender1 libxrandr2 \
            libfreetype6 fontconfig libasound2t64 libgl1 libpango-1.0-0 libcairo2 fonts-dejavu-core
          scripts/linux-deb-smoke.sh dist/*.deb "1.0.0-dev-${GITHUB_SHA:0:7}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.name == 'linux-arm'
        with:
          name: vless-client-linux-arm-${{ github.sha }}
          path: dist/*.deb
          retention-days: 14
          if-no-files-found: error

  # ========= Installers ====================================================
  # Every leg above builds its OS's installer and checks it on the runner
  # that built it, on pull requests as well, so a broken installer fails a
  # required check: the MSI is installed and uninstalled, each DEB is
  # installed, launched under Xvfb and removed, the DMG is mounted and its app
  # bundle inspected. Each is uploaded as an artifact (14 days), so any commit
  # can be tried without cutting a release. Tagged releases build and check
  # their installers in release.yml through the same scripts.

  # Rolling "dev-latest" prerelease: always holds ALL THREE installers
  # (DMG + MSI + DEB) of the newest merge at a stable URL on the Releases page
  # (downloadable without a GitHub login, never expires). Runs after the test
  # legs, which build every installer, so the release is never
  # half-populated. Delete+recreate
  # replaces the previous merge's assets; the tag is force-moved so the
  # release's source link points at the commit that was actually built. Real
  # releases stay untouched — a prerelease is never marked "Latest".
  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One upload at a time: two merges replacing the release at once could
    # leave it half deleted. Merges build in parallel, so an older one can
    # reach this job last; the step below keeps it from undoing a newer one.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Keeps the persisted token: this is the job that pushes the tag below.
      # The whole history, for the check that no newer merge is published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vless-client-*
          merge-multiple: true
          path: dist
      - name: Update rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          TAG=dev-latest
          PUBLISHED=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
          if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" != "$GITHUB_SHA" ] \
              && git merge-base --is-ancestor "$GITHUB_SHA" "$PUBLISHED"; then
            echo "$TAG already holds ${PUBLISHED:0:7}, a merge after ${GITHUB_SHA:0:7}; leaving it."
            exit 0
          fi
          git tag -f "$TAG"
          git push --force origin "$TAG"
          {
            echo "Auto-build of the newest merge to main (macOS DMG + Windows MSI + Linux DEB amd64/arm64)."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Checks: mvn clean verify -Psmoke on macOS, Windows and Linux (full tests + smoke on the real sing-box)"
          } > release-notes.md
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" dist/*.dmg dist/*.msi dist/*.deb \
            --prerelease \
            --title "Dev build ${GITHUB_SHA:0:7}" \
            --notes-file release-notes.md
