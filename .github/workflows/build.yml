name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Superseded PR pushes cancel their older runs; merge builds on main always
# run to completion so every merge yields its own installers.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # The JDK every job tests on and jpackage bakes into every installer: one
  # pin for the whole workflow. test-jdk27-ea keeps its own '27-ea' on
  # purpose — it is the canary for the next runtime and must float ahead.
  JAVA_VERSION: '25'
# Every checkout passes persist-credentials: false except dev-release's, the
# one job that pushes (git tag -f and a force push of dev-latest). Nothing
# else needs the token in .git/config, where every later step could read it.
jobs:
  # ============ Tests: run on every PR and push, one job per OS ============
  # -Psmoke additionally runs the real-binary smoke suites against the
  # bundled sing-box of that OS: version match, `sing-box check` over every
  # generated config shape, live runs (clash_api/http inbound; TUN probes
  # where the runner allows). Catches generator/core schema drift per OS.

  test:
    name: test-${{ matrix.name }}
    strategy:
      # Every leg reports on its own: a Windows-only failure must not cancel
      # the macOS run that would tell whether the change is cross-platform.
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
          - { name: linux, os: ubuntu-latest }
          # arm64 twin: GitHub's free arm runners for public repos. Exercises
          # the arch-aware bundling (linux-arm64 sing-box) with the same gates.
          - { name: linux-arm, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    # A leg takes 2-4 minutes. The smoke suite runs the real core, including
    # TUN probes where the runner allows; a hang there would otherwise sit on
    # the 6-hour default, on every leg, until someone noticed.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      # The sing-box tarballs are fetched at generate-resources on every build
      # (bundle-core-* profiles), so cache them per OS/arch. singbox.properties
      # pins both the version and the SHA-256s, so a bump misses the cache and
      # re-downloads; bundle-singbox.sh verifies the checksum either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - run: mvn -B clean verify -Psmoke
      - name: Probe a runtime linked from scripts/runtime-modules.txt
        # The suite runs on the full JDK, so a module missing from the
        # packaged runtime is invisible to it: this links exactly the listed
        # modules and probes what no test exercises. Linux only — the list is
        # the same on every OS, and one leg is enough to notice a gap.
        if: matrix.name == 'linux'
        run: scripts/verify-runtime-modules.sh

  # Early warning for the JDK 27 move (#216): the same suite, smoke included,
  # on the next runtime — months before anyone has to care.
  #
  # A job of its own rather than a fifth matrix leg, for one reason. Packaging
  # is gated on `needs: test`, so a canary inside that matrix would have to
  # carry continue-on-error to avoid blocking the installers — and that flag
  # can mask the very failure the canary exists to report. Standing apart, it
  # can fail loudly and still stop nothing: nothing needs it, and main requires
  # only test-macos, test-windows, test-linux and test-linux-arm.
  #
  # '27-ea' floats to whatever early-access build is newest. That is right for
  # a canary and wrong for an installer, which is why this pin appears here and
  # nowhere near a packaging job: jpackage bakes the CI JDK into the DMG, MSI
  # and DEB, and an -ea selector never converges to GA. The job goes away when
  # #216 moves everything to 27 at GA.
  test-jdk27-ea:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '27-ea'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - run: mvn -B clean verify -Psmoke

  # ========= Packaging: after that OS's tests ==============================
  # Each produces an installable artifact (14 days) so any main commit can be
  # tried without cutting a release, and each installer is checked on the
  # runner that built it: the MSI is installed and uninstalled, the DEB is
  # installed, launched under Xvfb and removed, the DMG is mounted and its
  # app bundle inspected. Windows and Linux amd64 also package on PRs so
  # their install/uninstall smoke checks run before merge. Tagged releases build
  # and check their installers in release.yml through the same scripts.

  package-macos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      # The sing-box tarballs are fetched at generate-resources on every build
      # (bundle-core-* profiles), so cache them per OS/arch. singbox.properties
      # pins both the version and the SHA-256s, so a bump misses the cache and
      # re-downloads; bundle-singbox.sh verifies the checksum either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - run: mvn -B package -DskipTests
      - name: Package DMG
        run: scripts/package-dmg.sh "1.0.0-dev-${GITHUB_SHA:0:7}" "1.0.${{ github.run_number }}"
      - name: Smoke-test the DMG payload
        # Mounts the DMG and checks Tunl.app inside it: launcher, runtime,
        # app.version, CFBundleVersion, the darwin core in the jar. Not
        # launched — the script says why a CI Mac is the wrong place for it.
        run: scripts/macos-dmg-smoke.sh dist/*.dmg "1.0.0-dev-${GITHUB_SHA:0:7}" "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vless-client-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 14
          if-no-files-found: error

  package-windows:
    needs: test
    runs-on: windows-latest
    # jpackage plus the MSI install/uninstall smoke; both are quick, WiX is not.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      # The sing-box tarballs are fetched at generate-resources on every build
      # (bundle-core-* profiles), so cache them per OS/arch. singbox.properties
      # pins both the version and the SHA-256s, so a bump misses the cache and
      # re-downloads; bundle-singbox.sh verifies the checksum either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - run: mvn -B package -DskipTests
      - name: Package MSI
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -Version "1.0.0-dev-$($env:GITHUB_SHA.Substring(0,7))" -MsiVersion "1.0.${{ github.run_number }}"
      - name: Smoke-test MSI install and uninstall
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-msi-smoke.ps1 -MsiPath "dist\*.msi" -ExpectedVersion "1.0.0-dev-$($env:GITHUB_SHA.Substring(0,7))"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vless-client-windows-${{ github.sha }}
          path: dist/*.msi
          retention-days: 14
          if-no-files-found: error

  package-linux:
    # Exercise the DEB maintainer scripts before merge as well as on main.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      # The sing-box tarballs are fetched at generate-resources on every build
      # (bundle-core-* profiles), so cache them per OS/arch. singbox.properties
      # pins both the version and the SHA-256s, so a bump misses the cache and
      # re-downloads; bundle-singbox.sh verifies the checksum either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - run: mvn -B package -DskipTests
      - name: Package DEB
        run: scripts/package-linux.sh "1.0.0-dev-${GITHUB_SHA:0:7}" "1.0.0+dev${{ github.run_number }}"
      - name: Smoke-test DEB install, launch and uninstall
        # Installs the .deb on the runner, runs /opt/tunl/bin/tunl under Xvfb
        # until the app writes "Tunl started" to its own log, then removes
        # the package. The libraries are the set scripts/linux-qa.sh needs to
        # render JavaFX without a GPU.
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            xvfb xauth libgtk-3-0t64 libglib2.0-0t64 libxtst6 libxi6 libxrender1 libxrandr2 \
            libfreetype6 fontconfig libasound2t64 libgl1 libpango-1.0-0 libcairo2 fonts-dejavu-core
          scripts/linux-deb-smoke.sh dist/*.deb "1.0.0-dev-${GITHUB_SHA:0:7}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vless-client-linux-${{ github.sha }}
          path: dist/*.deb
          retention-days: 14
          if-no-files-found: error

  package-linux-arm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      # The sing-box tarballs are fetched at generate-resources on every build
      # (bundle-core-* profiles), so cache them per OS/arch. singbox.properties
      # pins both the version and the SHA-256s, so a bump misses the cache and
      # re-downloads; bundle-singbox.sh verifies the checksum either way.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/vless-client-build
          key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/main/resources/singbox.properties') }}
      - run: mvn -B package -DskipTests
      - name: Package DEB (arm64)
        run: scripts/package-linux.sh "1.0.0-dev-${GITHUB_SHA:0:7}" "1.0.0+dev${{ github.run_number }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vless-client-linux-arm-${{ github.sha }}
          path: dist/*.deb
          retention-days: 14
          if-no-files-found: error

  # Rolling "dev-latest" prerelease: always holds ALL THREE installers
  # (DMG + MSI + DEB) of the newest merge at a stable URL on the Releases page
  # (downloadable without a GitHub login, never expires). Runs after every
  # packaging job so the release is never half-populated. Delete+recreate
  # replaces the previous merge's assets; the tag is force-moved so the
  # release's source link points at the commit that was actually built. Real
  # releases stay untouched — a prerelease is never marked "Latest".
  dev-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [package-macos, package-windows, package-linux, package-linux-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Keeps the persisted token: this is the job that pushes the tag below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vless-client-*
          merge-multiple: true
          path: dist
      - name: Update rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          TAG=dev-latest
          git tag -f "$TAG"
          git push --force origin "$TAG"
          {
            echo "Auto-build of the newest merge to main (macOS DMG + Windows MSI + Linux DEB amd64/arm64)."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Checks: mvn clean verify -Psmoke on macOS, Windows and Linux (full tests + smoke on the real sing-box)"
          } > release-notes.md
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" dist/*.dmg dist/*.msi dist/*.deb \
            --prerelease \
            --title "Dev build ${GITHUB_SHA:0:7}" \
            --notes-file release-notes.md
