name: Bump sing-box
# Proposes a core bump; never applies one. The pinned sing-box travels with
# the app because the config generator is written against that exact version
# — SingBoxRealBinarySmokeTest runs the real binary over every config shape,
# per OS, on every PR. So the safe thing to automate is the pinning, not the
# installing: this opens a pull request and lets that suite decide whether the
# new core is usable before a single user sees it.
on:
  schedule:
    # Daily, not weekly. A weekly cron means the gap between a core release
    # and this repo hearing about it averages three and a half days and runs
    # to seven — sing-box 1.13.19 shipped an hour after a Monday run and
    # would have waited until the next one. The cost of checking more often
    # is one API call: a run with nothing to do stops at the first step.
    # Off the hour: GitHub delays scheduled runs at the top of the hour, and
    # the 06:00 UTC run started between 09:51 and 11:21 in September 2026.
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin (x.y.z). Latest stable when empty.'
        required: false
        type: string

# Each job asks for what it needs; nothing is granted by default.
permissions:
  contents: read

jobs:
  # Runs another project's code: bump-singbox.sh downloads the release and
  # executes the host binary to confirm its version. So this job holds no
  # secret and cannot write to the repository. On a hosted runner that code
  # runs with passwordless sudo, and a token handed to any later step of the
  # same job would be one git hook or wrapper away from being read — and a
  # personal token that can push reaches main and a signed release without a
  # review.
  pin:
    runs-on: ubuntu-latest
    # bump-singbox.sh downloads and hashes five core archives; minutes, not hours.
    timeout-minutes: 20
    permissions:
      contents: read
      # For `gh pr list` below.
      pull-requests: read
    outputs:
      changed: ${{ steps.target.outputs.changed }}
      have: ${{ steps.target.outputs.have }}
      want: ${{ steps.target.outputs.want }}
      branch: ${{ steps.target.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Decide whether there is anything to do
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          want="$REQUESTED"
          if [ -z "$want" ]; then
            # /releases/latest is the only endpoint that excludes prereleases,
            # and sing-box publishes alpha/beta/rc tags continuously.
            want="$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)"
          fi
          want="${want#v}"
          # The tag name is written by another project, and a git tag may hold
          # characters a shell would run, or a newline that forges an output.
          # Nothing but a plain x.y.z leaves this step.
          if ! [[ "$want" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The requested or latest sing-box tag is not a plain x.y.z version; not pinning it."
            exit 1
          fi
          have="$(sed -n 's/^singbox\.version=//p' src/main/resources/singbox.properties)"
          branch="chore/singbox-$want"

          {
            echo "have=$have"
            echo "want=$want"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

          if [ "$want" = "$have" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pinned at $have, nothing to do"
          elif [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" != "0" ]; then
            # An earlier run already proposed this version and it is still
            # being decided on. Proposing it again would only add noise.
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "a pull request for $branch is already open"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pinned at $have, latest is $want"
          fi

      - name: Pin it
        if: steps.target.outputs.changed == 'true'
        # Downloads every bundled asset, hashes it locally, and cross-checks
        # each hash against the digest the Releases API publishes — two
        # different paths for the same bytes, so a tampered download fails
        # the bump instead of getting pinned. Then runs the host's own binary
        # to confirm it reports the version being pinned.
        env:
          WANT: ${{ steps.target.outputs.want }}
        run: scripts/bump-singbox.sh "$WANT"

      - name: Hand the pin to the job that proposes it
        if: steps.target.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: singbox-pin
          path: src/main/resources/singbox.properties
          if-no-files-found: error
          retention-days: 1

  # Holds the token and runs nothing that was downloaded: it checks the file
  # the pin job handed over, commits it, pushes the branch and opens the pull
  # request.
  propose:
    needs: pin
    if: needs.pin.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # For the dispatch below, which is what gets the pull request's checks
      # running without a personal access token.
      actions: write
    env:
      # Whether BUMP_TOKEN exists, as "true" or "false": a step's `if:` cannot
      # read the secrets context, the same trap release.yml notes for its
      # signing and certificate steps. The token itself goes only to the two
      # steps that push and open the pull request.
      HAVE_BUMP_TOKEN: ${{ secrets.BUMP_TOKEN != '' }}
      HAVE: ${{ needs.pin.outputs.have }}
      WANT: ${{ needs.pin.outputs.want }}
      BRANCH: ${{ needs.pin.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: singbox-pin
          path: pin

      - name: Check the pinned file before committing it
        # It comes from the job that ran the downloaded core, so it is checked
        # rather than trusted: apart from the version and the digests it must
        # be the file main has, and those must be a plain version (the one the
        # tag named) and hex digests.
        run: |
          set -euo pipefail
          [[ "$WANT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          current=src/main/resources/singbox.properties
          pinned=pin/singbox.properties
          assets='(darwin-(arm64|amd64)|windows-amd64|linux-(amd64|arm64))'
          keys="^singbox\.(version|sha256\.$assets)="
          diff <(grep -vE "$keys" "$current") <(grep -vE "$keys" "$pinned")
          grep -qx "singbox.version=$WANT" "$pinned"
          if grep -E "$keys" "$pinned" \
              | grep -vE "^singbox\.(version=[0-9]+\.[0-9]+\.[0-9]+|sha256\.$assets=[0-9a-f]{64})$"; then
            echo "::error::The pinned file holds a version or a digest in an unexpected form."
            exit 1
          fi
          cp "$pinned" "$current"
          rm -rf pin

      # BUMP_TOKEN, when it exists, is what makes the whole chore hands-free:
      # a pull request opened by a PAT gets an ordinary pull_request run,
      # while one opened by GITHUB_TOKEN gets a run parked in
      # "action_required" until a human approves it. Everything below works
      # either way; only that last click differs.
      - name: Push the branch
        env:
          PUSH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -am "chore(singbox): pin the core at $WANT"
          # On the command line, because checkout left no credentials behind.
          git push "https://x-access-token:${PUSH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" "$BRANCH"

      # Only without a PAT, and only to answer the question early. With
      # BUMP_TOKEN the pull request gets a real pull_request run and this
      # would be a duplicate of it.
      #
      # GITHUB_TOKEN is barred from triggering workflows — that is what stops
      # a workflow setting itself off forever — but workflow_dispatch is the
      # documented exception ("workflow_dispatch and repository_dispatch
      # events always create workflow runs"). build.yml runs its four test-*
      # jobs on any trigger and gates its packaging jobs on pushes to main, so
      # this starts exactly the four checks that matter.
      #
      # Worth being exact about what this does and does not buy: the run is
      # green or red on the branch within minutes, with nobody touching
      # anything, which is the whole question — does the new core still match
      # the generator. It does NOT satisfy the pull request's required checks:
      # those are only ever satisfied by the pull_request run, which is parked
      # until approved. Verified by experiment, not assumed.
      - name: Start the checks early
        if: env.HAVE_BUMP_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "$BRANCH"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
        run: |
          set -euo pipefail
          note=''
          if [ "$HAVE_BUMP_TOKEN" != "true" ]; then
            note=$'\n> This pull request\x27s checks are awaiting approval because GitHub requires approval for pull requests opened by `GITHUB_TOKEN`. Select **Approve and run**. The same four checks have already run against the branch in Actions.\n'
          fi

          if ! gh pr create --base main --head "$BRANCH" \
            --title "chore(singbox): bump the pinned core to $WANT" \
            --body "sing-box core: \`$HAVE\` → \`$WANT\`. Opened automatically; a maintainer decides whether to merge it.
          $note
          ## Automated verification

          \`scripts/bump-singbox.sh\` downloaded every asset, calculated its SHA-256 locally, and compared it with the digest returned by the Releases API. It then executed each platform binary and verified that it reports the requested version.

          ## Maintainer review

          - **Green \`-Psmoke\` checks on all four platforms** are the primary evidence: the suite runs the real binary against every generated configuration shape. A failed smoke test means the core and generator are incompatible.
          - For a **minor-version jump** (\`x.Y.z\`), review the sing-box changelog because minor releases have changed the configuration schema before.
          - The new core reaches users in the next application release. The first TUN connection after upgrading will request administrator credentials because the binary no longer matches the privileged copy referenced by sudoers. This is expected."; then
            echo "::error::The bump succeeded and $BRANCH is pushed with its \
          checks already running, but the pull request could not be opened. \
          Open it in one click: \
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH — or \
          enable Settings > Actions > General > 'Allow GitHub Actions to \
          create and approve pull requests' to have this step do it."
            exit 1
          fi
