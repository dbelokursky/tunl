name: Bump sing-box
# Proposes a core bump; never applies one. The pinned sing-box travels with
# the app because the config generator is written against that exact version
# — SingBoxRealBinarySmokeTest runs the real binary over every config shape,
# per OS, on every PR. So the safe thing to automate is the pinning, not the
# installing: this opens a pull request and lets that suite decide whether the
# new core is usable before a single user sees it.
on:
  schedule:
    # Daily, not weekly. A weekly cron means the gap between a core release
    # and this repo hearing about it averages three and a half days and runs
    # to seven — sing-box 1.13.19 shipped an hour after a Monday run and
    # would have waited until the next one. The cost of checking more often
    # is one API call: a run with nothing to do stops at the first step.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pin (x.y.z). Latest stable when empty.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  # For the dispatch below, which is what gets the pull request's checks
  # running without a personal access token.
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # Via job env, not the secrets context: `secrets` is not available in a
    # step's `if:`, which is the same trap release.yml notes for its signing
    # and certificate steps.
    env:
      BUMP_TOKEN: ${{ secrets.BUMP_TOKEN }}
    steps:
      # BUMP_TOKEN, when it exists, is what makes the whole chore hands-free:
      # a pull request opened by a PAT gets an ordinary pull_request run,
      # while one opened by GITHUB_TOKEN gets a run parked in
      # "action_required" until a human approves it. Everything below works
      # either way; only that last click differs.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BUMP_TOKEN || github.token }}

      - name: Decide whether there is anything to do
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          want="$REQUESTED"
          if [ -z "$want" ]; then
            # /releases/latest is the only endpoint that excludes prereleases,
            # and sing-box publishes alpha/beta/rc tags continuously.
            want="$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)"
          fi
          want="${want#v}"
          have="$(sed -n 's/^singbox\.version=//p' src/main/resources/singbox.properties)"
          branch="chore/singbox-$want"

          {
            echo "have=$have"
            echo "want=$want"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

          if [ "$want" = "$have" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pinned at $have, nothing to do"
          elif [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" != "0" ]; then
            # An earlier run already proposed this version and it is still
            # being decided on. Proposing it again would only add noise.
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "a pull request for $branch is already open"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pinned at $have, latest is $want"
          fi

      - name: Pin it
        if: steps.target.outputs.changed == 'true'
        # Downloads every bundled asset, hashes it locally, and cross-checks
        # each hash against the digest the Releases API publishes — two
        # different paths for the same bytes, so a tampered download fails
        # the bump instead of getting pinned. Then runs the host's own binary
        # to confirm it reports the version being pinned.
        run: scripts/bump-singbox.sh "${{ steps.target.outputs.want }}"

      - name: Push the branch
        if: steps.target.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          WANT: ${{ steps.target.outputs.want }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git commit -am "chore(singbox): pin the core at $WANT"
          git push -u origin "$BRANCH"

      # Only without a PAT, and only to answer the question early. With
      # BUMP_TOKEN the pull request gets a real pull_request run and this
      # would be a duplicate of it.
      #
      # GITHUB_TOKEN is barred from triggering workflows — that is what stops
      # a workflow setting itself off forever — but workflow_dispatch is the
      # documented exception ("workflow_dispatch and repository_dispatch
      # events always create workflow runs"). build.yml runs its four test-*
      # jobs on any trigger and gates its packaging jobs on pushes to main, so
      # this starts exactly the four checks that matter.
      #
      # Worth being exact about what this does and does not buy: the run is
      # green or red on the branch within minutes, with nobody touching
      # anything, which is the whole question — does the new core still match
      # the generator. It does NOT satisfy the pull request's required checks:
      # those are only ever satisfied by the pull_request run, which is parked
      # until approved. Verified by experiment, not assumed.
      - name: Start the checks early
        if: steps.target.outputs.changed == 'true' && env.BUMP_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: gh workflow run build.yml --ref "$BRANCH"

      - name: Open the pull request
        if: steps.target.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
          HAVE: ${{ steps.target.outputs.have }}
          WANT: ${{ steps.target.outputs.want }}
          BRANCH: ${{ steps.target.outputs.branch }}
          HAVE_PAT: ${{ secrets.BUMP_TOKEN != '' }}
        run: |
          set -euo pipefail
          note=''
          if [ "$HAVE_PAT" != "true" ]; then
            note=$'\n> Проверки этого PR ждут одобрения — так GitHub поступает с прогонами на PR, открытых `GITHUB_TOKEN`. Нажми **Approve and run**. Ответ при этом уже известен: те же четыре проверки прогнаны на ветке отдельным запуском, в списке Actions.\n'
          fi

          if ! gh pr create --base main --head "$BRANCH" \
            --title "chore(singbox): bump the pinned core to $WANT" \
            --body "Ядро sing-box: \`$HAVE\` → \`$WANT\`. Открыто автоматически, применять решает человек.
          $note
          ## Что уже проверено

          \`scripts/bump-singbox.sh\` скачал каждый ассет, посчитал SHA-256 локально и сверил с дайджестом из Releases API — две разные дороги для одних и тех же байт. Затем запустил бинарь своей платформы и убедился, что тот рапортует нужную версию.

          ## Что должен посмотреть человек

          - **Зелёный \`-Psmoke\` на всех четырёх платформах** — это и есть главный аргумент: сюита гоняет настоящий бинарь по каждой форме генерируемого конфига. Красный smoke означает, что новое ядро разошлось с генератором.
          - **Минорный скачок** (\`x.Y.z\`) — повод открыть changelog sing-box: между минорными версиями там ломали схему конфига.
          - Ядро уедет к пользователям следующим релизом приложения, и первый Connect в TUN после этого запросит админский пароль — sing-box изменился и больше не совпадает с root-копией из правила sudoers. Так задумано."; then
            echo "::error::The bump succeeded and $BRANCH is pushed with its \
          checks already running, but the pull request could not be opened. \
          Open it in one click: \
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH — or \
          enable Settings > Actions > General > 'Allow GitHub Actions to \
          create and approve pull requests' to have this step do it."
            exit 1
          fi
