junit.jupiter.extensions.autodetection.enabled=true
# A test that hangs fails after two minutes, with a dump of every thread
# printed first. The slowest test takes about 5 s on a laptop; a hang used to
# run until the CI job's own 25-minute limit and end with nothing said about
# which test, or where it waited. Off while a debugger is attached.
junit.jupiter.execution.timeout.default=2 m
junit.jupiter.execution.timeout.threaddump.enabled=true
junit.jupiter.execution.timeout.mode=disabled_on_debug
