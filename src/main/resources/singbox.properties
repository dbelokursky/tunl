singbox.sha256.windows-amd64=c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32
singbox.sha256.linux-amd64=a684484d7477d1437282ee411f4d131d0340aaad60a7868841ebd5d87dd8a0c6
