# Single source of truth for the pinned sing-box build.
#
# Consumed by three build/runtime layers so the values can never drift apart:
#   - pom.xml           (properties-maven-plugin, initialize phase)
#   - scripts/bundle-singbox.sh / .ps1 (build-time bundling + checksum verify)
#   - SingBoxInstaller  (classpath resource, runtime fallback download)
#
# singbox.release names Tunl's own build of singbox.version, the pre-release
# core-v<version>-tunl<N> of this repository that .github/workflows/core.yml
# makes with the patches in packaging/sing-box; empty means upstream's
# release on SagerNet/sing-box.
#
# One checksum per bundled asset: darwin and linux tar.gz per arch and the
# windows amd64 zip. The build host's OS (and, on Linux, its architecture)
# decides which one gets verified & bundled.
#
# To bump: run scripts/bump-singbox.sh <version> <revision> && mvn clean verify -Psmoke
singbox.version=1.14.3
singbox.release=core-v1.14.3-tunl3
singbox.sha256.darwin-arm64=c0f694d2e929c93673d17e16be9e0fc221b021bb7e92d07d5ec458251b25df8d
singbox.sha256.darwin-amd64=894aa8196becd1a74e30a2fd317b98b019e1172fd066ee5dda4a135fb1becf4f
singbox.sha256.windows-amd64=345a65c533f4ab806218978c6279959f494bec9ab85f639ba5244743be201fe4
singbox.sha256.linux-amd64=956c59dfb4fb85f91846cbc869bf6ce3a1ee74c7508d58d7849434a2ca52db6d
